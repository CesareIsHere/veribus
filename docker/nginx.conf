server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path is handled by the Flutter router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets can be cached for a long time.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Never cache the entry points, or users get stuck on old versions.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
