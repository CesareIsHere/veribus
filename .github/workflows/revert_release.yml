# Merging a PR titled "Revert ..." into main reverts the last version bump and
# deletes its tag + release; the deploy workflows then ship the reverted code.
name: Revert release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  revert:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Revert')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Revert last version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(grep -E '^version: ' pubspec.yaml | sed 's/version: //')
          BUMP=$(git log --grep="bump version to" --format=%H -n 1)
          if [ -z "$BUMP" ]; then echo "No version bump commit found"; exit 1; fi
          git revert --no-edit "$BUMP"
          git push origin main
          gh release delete "v$CURRENT" --yes --cleanup-tag || echo "Release v$CURRENT not found"
