# Nightly import of the RSM static GTFS (RF-80). The snapshot archive expires by itself (R2 lifecycle rule, 30 days).
# A failed import fails the workflow and GitHub sends the email (RF-86); the active version stays.
#
# Secrets: SUPABASE_DB_URL (session pooler, user postgres.<project ref>), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Variables: IN_PLACE = 1 on the Supabase free plan (see backend/static-import/import.sh)
name: Static import

on:
  schedule:
    - cron: "30 4 * * *" # 06:30 in Rome (summer time); RSM publishes around 05:30
  workflow_dispatch:
    inputs:
      force:
        description: Import even if the md5 is unchanged
        type: boolean
        default: false

concurrency: static-import

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Dart builds the journey planner timetables (tool/journeys).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: bash backend/static-import/import.sh
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
          IN_PLACE: ${{ vars.IN_PLACE }}
