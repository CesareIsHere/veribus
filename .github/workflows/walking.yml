# Walking distances between nearby stops, along the streets (OpenStreetMap + OSRM, tool/journeys/walking.sh), for the
# journey planner. Streets change slowly: weekly is enough. The nightly import (static_import.yml) reads the file;
# without it, walking is the straight line × 1.3.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (as the import). On a pull request it only checks that the
# pipeline works and keeps the file as an artifact.
name: Walking distances

on:
  schedule:
    - cron: "17 2 * * 1" # Monday night, before the import
  workflow_dispatch:
  pull_request:
    paths:
      - tool/journeys/walking.*
      - .github/workflows/walking.yml

concurrency: walking

jobs:
  walking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: bash tool/journeys/walking.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: walking
          path: out/walking.csv.gz
          retention-days: 7
      - if: github.event_name != 'pull_request'
        run: |
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/network/journeys/walking.csv.gz" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/gzip" \
            -H "Cache-Control: max-age=3600" -H "x-upsert: true" --data-binary @out/walking.csv.gz > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
