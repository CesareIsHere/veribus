# Web -> Firebase Hosting. Runs after every release and every revert, or manually.
# Not after a hand-run Release (it only rebuilds the APK of an existing tag).
# Needs: vars.FIREBASE_PROJECT_ID, secrets.FIREBASE_SERVICE_ACCOUNT
name: Deploy web

on:
  workflow_run:
    workflows: [Release, Revert release]
    types: [completed]
  workflow_dispatch:

# The newest main wins: an older deploy still running is dropped.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter build web --release --dart-define-from-file=env/prod.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
