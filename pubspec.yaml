name: veribus
description: "Veribus: Rome bus and tram arrivals, live."
publish_to: "none"
version: 0.11.3+24

environment:
  sdk: ^3.13.0
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: any
  skeletonizer: ^3.0.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  talker_flutter: ^5.1.20
  talker_dio_logger: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  sentry_flutter: ^9.30.1
  sentry_dio: ^9.30.1

  # Feature: connectivity
  connectivity_plus: ^7.3.1
  # Feature: app review
  # Feature: profile (avatar)
  image_picker: ^1.2.3
  # Feature: biometric lock
  # Feature: payments
  # Feature: social login
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.6
  # Feature: push notifications
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Firebase (backend firebase / push / remote config / analytics / ai)
  firebase_core: ^4.15.0

  # Supabase (backend supabase)
  supabase_flutter: ^2.17.2
  flutter_map: ^8.3.2
  # Vector tiles: the base map is drawn by the app (minimal style) from OpenFreeMap data.
  vector_map_tiles: ^9.0.0-beta.13
  vector_tile_renderer: ^6.1.0
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
